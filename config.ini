; Pegasus Android Detector configuration.
; Paths are resolved relative to the executable directory unless absolute.
[adb]
; Full path to adb.exe. Leave empty to auto-detect (bin\adb.exe or PATH).
AdbPath=C:\Users\test\source\nsys\pegasuspas\bin\adb.exe
; Command timeout in milliseconds.
TimeoutMs=30000

[scan]
; Skip system packages (only scan third-party / user apps).
SkipSystemPackages=1
; Maximum number of APKs to pull and scan (0 = unlimited).
MaxApkPull=4
; Extract printable strings from classes.dex for IoC matching.
ExtractStrings=1
; Minimum printable string length to keep.
MinStringLen=6
; Download and scan SMS messages for IoC links/domains (needs root/older device).
ScanMessages=1
; Maximum number of SMS messages to inspect (0 = unlimited).
MessagesMaxRows=5000

[paths]
; Directory containing *.stix2 (MVT) and *.txt IoC rule files.
RulesDir=data
; Directory for generated reports.
ReportDir=reports
; Working directory for pulled/extracted APKs (empty = <exedir>\work).
WorkDir=work
